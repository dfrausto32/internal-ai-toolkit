[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitk"]

[project]
name = "aitk"
version = "0.1.0"
description = "Cost-optimized spec-to-code pipeline: Claude generation, Haiku review, optional local Ollama models"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=1.0.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
aitk = "aitk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
