[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitk"]

[project]
name = "aitk"
version = "0.1.0"
description = "Ollama + Claude orchestration for cost-optimized code generation"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
aitk = "aitk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
